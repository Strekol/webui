[project]
name = "claude-watcher-webui"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "fastapi-structured-logging>=0.5.0",
    "httpx>=0.28.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.44b0",
    "opentelemetry-instrumentation-httpx>=0.44b0",
    "opentelemetry-exporter-otlp>=1.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    # Pinned in lockstep with the tui/gtk clients (see .pre-commit-config.yaml):
    # detect.py is hand-aligned with their copies, so a version skew makes a
    # back-ported change redden a PR in another repo.
    "mypy>=2.1",
    "ruff>=0.16",
    "pre-commit>=4.0.0",
    "detect-secrets>=1.5.0",
]

[tool.ruff]
line-length = 110
# The CI checks the two client repos out into _tui/ and _gtk/ so
# tests/test_detection_parity.py can compare the three implementations. They are
# NOT this repo's code and carry their own gates — linting them here applied
# webui's config to files that deliberately import mid-module, for 46 errors on
# code this PR does not own.
extend-exclude = ["_tui", "_gtk"]
# py310, NOT py314 — deliberately BELOW `requires-python`, which stays >=3.14 (the
# app runs on 3.14). This knob is the SYNTAX ceiling ruff may produce, and
# `detect.py` is hand-aligned, symbol by symbol, with the copies inside
# claude-watcher-tui.py (py311) and claude-watcher-gtk.py (py310). At py314 the
# FORMATTER rewrites `except (A, B):` into PEP 758 `except A, B:`, which is a hard
# SyntaxError for both clients — the shared detection core stops being copyable,
# and `webui/tests/test_detection_parity.py` can no longer even parse them.
# py310 = the lowest of the three. Costs nothing here: no 3.11+ syntax is in use.
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["detect", "auth"]

[tool.mypy]
python_version = "3.14"
# Same reason as ruff's extend-exclude: _tui/ and _gtk/ are the sibling repos the
# CI checks out for the parity guard, not this repo's code.
exclude = ["^_tui/", "^_gtk/"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
strict_optional = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = ["e2e: end-to-end tests requiring external services"]
