name: ci

# Lint + type-check + tests on every PR and push to the main branches.
# Mirrors the local gate: `make lint` (ruff + mypy) and `make test` (pytest).

on:
  push:
    branches: [main, master, develop, trunk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # detect.py is a hand-aligned copy of the detection engine both clients
      # carry. tests/test_detection_parity.py compares the three by BEHAVIOUR —
      # it skips when the siblings are absent locally, but FAILS under CI, so
      # they have to be here or the guard never runs where it matters. Matching
      # branch first (one shared-core change lands under one branch name in the
      # three repos), default branch otherwise. Corollary, an ORDERING
      # CONSTRAINT rather than a defect: a detection change is only green here
      # once its twins are pushed to the client repos.
      # tests/test_detection_parity.py compares detect.py against the two clients,
      # so their sources must be here. Which REVISION is the subtle part: a shared
      # change lands in three repos that do not have to agree on a branch name (this
      # one is `feat/scan-cache-and-basic-auth`, the clients' is
      # `feat/remote-sessions`). Assuming the name matched compared a new server
      # against pre-feature clients and failed on a divergence that does not exist.
      # Resolution, in order: same branch name in the PR author's fork, then here,
      # else the head of the sibling's single open PR, else its default branch. The
      # third rule is a heuristic and is deliberately narrow — with several PRs open
      # we fall back rather than guess.
      #
      # Fork first because a PR from a fork pushes its twins to the same fork
      # (assumed to keep the repo names), never here; and the open-PR rule checks
      # out the PR's head REPO, not just its branch name, which does not exist here
      # when the PR comes from a fork.
      #
      # Branch and fork owner go through env, not inline `${{ }}`: a fork PR's
      # branch name is attacker-controlled and would be spliced into the script.
      - name: Resolve the sibling revisions
        id: siblings
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          FORK_OWNER: ${{ github.event.pull_request.head.repo.fork && github.event.pull_request.head.repo.owner.login || '' }}
        run: |
          set -euo pipefail
          for r in tui gtk; do
            repo="claude-watcher/$r"
            ref=""
            for owner in ${FORK_OWNER:+"$FORK_OWNER"} claude-watcher; do
              if git ls-remote --exit-code --heads "https://github.com/$owner/$r.git" "$BRANCH" >/dev/null 2>&1; then
                repo="$owner/$r"
                ref="$BRANCH"
                break
              fi
            done
            if [ -z "$ref" ]; then
              # `select(.head.repo)`: a PR whose fork was deleted has no head repo to check out.
              open=$(gh api "repos/claude-watcher/$r/pulls?state=open" --jq '[.[] | select(.head.repo) | "\(.head.repo.full_name):\(.head.ref)"] | join(" ")' 2>/dev/null || echo "")
              if [ "$(printf '%s' "$open" | wc -w)" = "1" ]; then
                repo="${open%%:*}"
                ref="${open#*:}"
              fi
            fi
            echo "${r}=$repo@${ref:-<default branch>}"
            echo "${r}_repo=$repo" >> "$GITHUB_OUTPUT"
            echo "${r}_ref=$ref" >> "$GITHUB_OUTPUT"
          done

      - name: Checkout the TUI (shared detection core)
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.siblings.outputs.tui_repo }}
          ref: ${{ steps.siblings.outputs.tui_ref }}
          path: _tui

      - name: Checkout the GTK widget (shared detection core)
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.siblings.outputs.gtk_repo }}
          ref: ${{ steps.siblings.outputs.gtk_ref }}
          path: _gtk

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # requires-python = ">=3.14"; uv fetches the interpreter and locks deps.
      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .

      - name: Pytest
        run: uv run pytest
